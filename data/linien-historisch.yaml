# Linienarchiv Zürich – Tramnetz vor 2010 (1882–2009)
#
# Ergänzt data/linien.yaml. scripts/build-data.mjs liest beide Dateien:
#   - Versionen einer Linie, die es in linien.yaml schon gibt, werden dort angehängt.
#   - Linien, die es nur hier gibt (z.B. Linie 1, Privatbahnen), kommen neu dazu.
#
# Quelle ist die Wikipedia-Linienchronik (wp-chronik), für Gleise und Daten zusätzlich der Artikel
# Strassenbahn Zürich (wp-strab). Die Chronik nennt Endpunkte und einzelne Wegpunkte, keine
# Haltestellenlisten. Die Zwischenhalte sind deshalb die heutigen Haltestellen an derselben Strecke
# (Status «abgeleitet»). Wo die Chronik widersprüchlich oder ungenau ist, steht «unsicher».
#
# Wegbausteine wie in linien.yaml. Der Router fährt für eine Version nur über Gleise, die an ihrem
# ersten Tag in Betrieb waren (siehe gleise_zeiten und historische_strecken).

