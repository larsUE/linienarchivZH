    nummer: Riesbach
    name: "Riesbacher Linie"
    farbe: "#8C6239"
    versionen:
      - von: 1882-09-05
        bis: 1882-09-23
        weg: [Wildbachstrasse, Bellevue, Helmhaus, Central, Bahnhofstrasse/HB, Paradeplatz]
        status: abgeleitet
        quellen: [wp-chronik, wp-strab]
        notiz: "Rösslitram der Zürcher Strassenbahn-Gesellschaft (ZStG), Normalspur. Endpunkt Wildbachstrasse (Tiefenbrunnen/Hornegg)."
