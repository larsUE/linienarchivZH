# Linienarchiv Zürich – Pilotdaten (Tram, 2010–2026)
#
# Jede Linie hat Versionen mit Gültigkeit (von/bis, beide inklusive, null = offen).
# Der Linienweg ("weg") ist eine Folge von Bausteinen:
#   - {osm: <Relations-ID>}                  ganze heutige OSM-Linienrelation
#   - {osm: <ID>, von: <Halt>, bis: <Halt>}  Ausschnitt daraus (auch rückwärts)
#   - "<Haltestelle>"                        Wegpunkt; die Lücke füllt der Router über das Gleisnetz
#
# status:
#   belegt      Linienweg durch Quelle belegt, Haltestellen aus OSM
#   abgeleitet  Endpunkte/Wegpunkte belegt, Zwischenhalte rekonstruiert
#   unsicher    Quellen widersprüchlich oder nur sinngemäss geprüft

stichtag: "07-01"          # Netzstand pro Jahr: 1. Juli
zeitraum: [2010, 2026]

quellen:
  osm:
    titel: "OpenStreetMap, Tram-Linienrelationen und Gleise"
    url: "https://www.openstreetmap.org"
    lizenz: "ODbL"
    abgerufen: 2026-11-22
  wp-strab:
    titel: "Wikipedia: Strassenbahn Zürich"
    url: "https://de.wikipedia.org/wiki/Strassenbahn_Z%C3%BCrich"
    abgerufen: 2026-11-22
  wp-chronik:
    titel: "Wikipedia: Linienchronik der Strassenbahn Zürich"
    url: "https://de.wikipedia.org/wiki/Linienchronik_der_Strassenbahn_Z%C3%BCrich"
    abgerufen: 2026-11-22

zusatz_haltestellen:
  # Haltestellen, die heute von keinem Tram bedient werden, früher aber schon.
  - name: "Bahnhofquai/HB"
    osm_knoten: [29271923, 2264870172]   # in OSM als Tramhaltestelle "im Bau" erfasst

