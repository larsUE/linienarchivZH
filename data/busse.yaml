# Linienarchiv Zürich – VBZ-Buslinien ab 2015
#
# Erzeugt mit scripts/import/bus-versionen.mjs aus den Fahrplandaten (data/import/bus/), danach von Hand gepflegt.
# Aufbau wie data/linien.yaml. Der Linienweg ist eine Haltestellenliste: Tramhaltestellen heissen wie in
# data/linien.yaml, Bushaltestellen wie in data/bus/haltestellen.json. Fahrwege stehen in data/bus/kanten.json.
# Quellen (gtfs, vbz-fahrzeiten) sind in data/linien.yaml definiert.
# Farben: Linien mit eigener Farbe (z.B. Trolleybusse) wie in den Fahrplandaten, alle anderen im Busblau
# des ZVV-Liniennetzplans (#75BEE9). In den Fahrplandaten sind sie weiss.
#
# Für die Jahre vor 2015 gibt es keine Busdaten; das Archiv zeigt Autobusse ab 2015. Die Trolleybuslinien reichen
# nach der Wikipedia-Chronik weiter zurück (Versionen mit Quelle wp-trolleybus, Status abgeleitet oder unsicher).

erfasst_ab: 2015

fahrplan_alias:
  # Haltestellennamen aus den Fahrplandaten -> unsere Haltestelle (Id), wie in data/linien.yaml
  "Zollikon, Bleulerstrasse": bleulerstrasse
  "Zürich, Carl-Spitteler-Strasse": zentrum-witikon
  "Zürich, Pflegezentr. Käferberg": kaferberg
  "Zürich, Kindersp. (ab 10/2024)": kinderspital

quellen:
  # zusätzlich zu den Quellen in data/linien.yaml
  wp-trolleybus:
    titel: "Wikipedia: Trolleybus Zürich"
    url: "https://de.wikipedia.org/wiki/Trolleybus_Z%C3%BCrich"
    abgerufen: 2026-11-28

# Trolleybusse
# Je Linie:
#   trolleybus: Zeiträume, in denen die Linie als Trolleybus verkehrt (von/bis taggenau, null = offen).
#               Ohne Eintrag ist die Linie ein Autobus. Belegt durch Wikipedia und die Fahrplandaten
#               (GTFS: route_id mit Präfix 2 = VBZ-Trolleybus, 3 = VBZ-Bus).
#   chronik:    Ereignisse aus der Linienchronik (Wikipedia: Trolleybus Zürich), auch vor 2015 und geplante.
#               datum: Tag, Monat (2020-04) oder Jahr (2015); geplant: true für Vorhaben.
# fahrleitungslos: Abschnitte, auf denen die Trolleybusse ohne Fahrleitung mit Akku fahren.
#   strecke: aufeinanderfolgende Haltestellen; gilt für jeden Trolleybus, der dort fährt.
fahrleitungslos:
  - strecke: ["Hardplatz", "Albisriederplatz"]
    von: 2014-12-14  # Umbau 2015 nicht taggenau bekannt: ab Beginn der Busdaten
    notiz: "Seit dem Umbau des Albisriederplatzes 2015 kreuzt die Fahrleitung die Tramlinien nicht mehr. Die Trolleybusse senken die Stromabnehmer und fahren mit Akku bis zur nächsten Haltestelle."
    quellen: [wp-trolleybus]
  - strecke: ["Bahnhof Altstetten", "Bristenstrasse", "Baslerstrasse", "Letzipark West", "Kappeli", "Flurstrasse", "Albisrank", "Hubertus"]
    von: 2019-12-15
    notiz: "Linie 83 fährt westlich des Albisriederplatzes ohne Fahrleitung; die Akkus laden unter der Fahrleitung zwischen Hardplatz und Milchbuck. Ab Hubertus nutzt sie die Fahrleitung der Linie 33."
    quellen: [wp-trolleybus]
  - strecke: ["Waidspital", "Weihersteig", "Bucheggplatz"]
    von: 2026-10-19
    notiz: "Linie 69 hat Fahrleitung nur zwischen ETH Hönggerberg und Waidspital sowie zwischen Bucheggplatz und Milchbuck; dazwischen fährt sie mit Akku (aus der Chronik geschlossen)."
    quellen: [wp-trolleybus]

