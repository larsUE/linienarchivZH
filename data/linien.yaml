# Linienarchiv Zürich – Tramnetz 2010–2026
# (Buslinien ab 2015 stehen in data/busse.yaml; Quellen und fahrplan_alias hier gelten auch dort.)
#
# Jede Linie hat Versionen mit Gültigkeit (von/bis, beide inklusive, null = offen).
# Der Linienweg ("weg") ist eine Folge von Bausteinen:
#   - {osm: <Relations-ID>}                  ganze heutige OSM-Linienrelation
#   - {osm: <ID>, von: <Halt>, bis: <Halt>}  Ausschnitt daraus (auch rückwärts)
#   - "<Haltestelle>"                        Wegpunkt; die Lücke füllt der Router über das Gleisnetz
#
# status:
#   belegt      Linienweg durch Quelle belegt, Haltestellen aus OSM
#   abgeleitet  Endpunkte/Wegpunkte belegt, Zwischenhalte rekonstruiert
#   unsicher    Quellen widersprüchlich oder nur sinngemäss geprüft
#
# Fahrplandaten (scripts/import/, Bericht in data/import/bericht.md) belegen die Linienwege
# ab 2015 (Stichwochen) bzw. lückenlos ab Dezember 2018 (GTFS). Für 2010–2014 gibt es keine
# Fahrplandaten; Versionen, die vor 2015 beginnen, sind für diese Jahre nur angenommen.

stichtag: "07-01"          # Netzstand pro Jahr: 1. Juli
zeitraum: [2010, 2026]

quellen:
  osm:
    titel: "OpenStreetMap, Tram-Linienrelationen und Gleise"
    url: "https://www.openstreetmap.org"
    lizenz: "ODbL"
    abgerufen: 2026-11-22
  wp-strab:
    titel: "Wikipedia: Strassenbahn Zürich"
    url: "https://de.wikipedia.org/wiki/Strassenbahn_Z%C3%BCrich"
    abgerufen: 2026-11-22
  wp-chronik:
    titel: "Wikipedia: Linienchronik der Strassenbahn Zürich"
    url: "https://de.wikipedia.org/wiki/Linienchronik_der_Strassenbahn_Z%C3%BCrich"
    abgerufen: 2026-11-22
  gtfs:
    titel: "Stadt Zürich Open Data: Fahrplandaten VBZ/ZVV (GTFS), Fahrplanjahre 2019–2026"
    url: "https://data.stadt-zuerich.ch/dataset/vbz_fahrplandaten_gtfs"
    lizenz: "CC0"
    abgerufen: 2026-11-22
  vbz-fahrzeiten:
    titel: "Stadt Zürich Open Data: Fahrzeiten SOLL-IST VBZ, je eine Stichwoche 2015–2018"
    url: "https://data.stadt-zuerich.ch/dataset?q=vbz_fahrzeiten_ogd"
    lizenz: "CC0"
    abgerufen: 2026-11-22

fahrplan_alias:
  # Haltestellennamen aus Fahrplandaten (scripts/import/import-fahrplan.mjs) -> unsere Haltestelle.
  # Meist Umbenennungen bei gleicher Lage; belegt durch die Nachbarhalte in den Fahrten.
  "Zürich, Schörlistrasse": ueberlandpark          # umbenannt, zwischen Waldgarten und Schwamendingerplatz
  "Zürich, Dammweg": lowenbrau                     # umbenannt, zwischen Escher-Wyss-Platz und Quellenstrasse
  "Zürich, Radiostudio": brunnenhof                # umbenannt, zwischen Bad Allenmoos und Bucheggplatz
  "Zürich, Börsenstrasse": kantonalbank            # umbenannt, zwischen Bürkliplatz und Paradeplatz
  "Zürich, Krematorium Sihlfeld": altes-krematorium
  "Zürich, Post Wollishofen": renggerstrasse       # umbenannt, zwischen Morgental und Bhf. Wollishofen
  "Zürich, Bhf Wollishofen (Tram)": bahnhof-wollishofen-staubstrasse
  "Zürich, Wollishofen": wollishoferplatz          # Endstation Linie 7
  "Dübendorf, Giessen": am-ring                    # umbenannt auf Fahrplanwechsel Dezember 2021
  "Zürich Flughafen, Bahnhof": zurich-flughafen
  "Zürich, Gessnerallee": null                     # Wendeschlaufe der Linien 10/17 am HB (2015–2018), in OSM keine Tramhaltestelle

zusatz_haltestellen:
  # Haltestellen, die heute von keinem Tram bedient werden, früher aber schon.
  - name: "Bahnhofquai/HB"
    osm_knoten: [29271923, 2264870172]   # in OSM als Tramhaltestelle "im Bau" erfasst

