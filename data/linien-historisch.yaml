# ---------------------------------------------------------------------------------------------------
# Linien
#
# Vor 1906 hatten die Linien keine Nummern: Die Privatbahnen tragen hier ihr Kürzel, die städtischen
# Linien ihren Namen (bis 1900) bzw. ihre Farbe (1900–1905). Ihre Farbe ist die Wagenfarbe bzw. die
# Linienfarbe laut Chronik. Für eingestellte Liniennummern (1, 21–24) ist die Farbe frei gewählt.
# Die Liniennummern gelten hier ab 1.1.1906 (Chronik: «1905/1906»).
#
# Ein Weg ist eine Folge von Wegpunkten in Fahrtrichtung der Chronik. Schlaufen und Rundkurse sind
# vereinfacht; Äste, Einsatzkurse und Kurse nur zu gewissen Zeiten stehen in der Notiz.
linien:
